[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valleytainment-visual-brain"
version = "0.1.0"
description = "AI visual performance instrument for EDM — music intelligence + Godot live engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Valleytainment" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
stems = ["demucs>=4.0"]
librosa = ["librosa>=0.10.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vbrain = "vbrain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["packages/vbrain"]

[tool.hatch.build.targets.wheel.sources]
"packages/vbrain" = "vbrain"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "B008",   # Typer Argument/Option defaults
  "E501",   # line length handled by formatter preference
  "UP042",  # keep str, Enum for broader pydantic compatibility
  "RUF001", # allow en-dash in UI strings
  "RUF003", # allow en-dash in comments
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["EXE001"]
"packages/vbrain/director/ollama_director.py" = ["BLE001"]
